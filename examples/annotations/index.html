<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doodle-ui - annotations</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 4rem;
        padding: 3rem 1.5rem;
        background: radial-gradient(
          ellipse at 30% 20%,
          #2a1458 0%,
          #0b0b14 55%
        );
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      .card {
        width: min(280px, 80vw);
        padding: 1.75rem 1.5rem;
        border-radius: 28px;
        background: linear-gradient(
          160deg,
          rgba(120, 80, 255, 0.35),
          rgba(20, 20, 40, 0.9)
        );
        text-align: center;
        box-shadow: 0 0 40px rgba(140, 90, 255, 0.25);
      }
      .card h2 {
        margin: 0 0 0.35rem;
        font-size: 1.25rem;
      }
      .card p {
        margin: 0;
        opacity: 0.7;
        font-size: 0.9rem;
      }
      .languages {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .languages button {
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .languages button[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.6);
      }
      .caption {
        margin: 0.75rem 0 0;
        opacity: 0.55;
        font-size: 0.8rem;
        text-align: center;
      }
      .cta {
        padding: 0.9rem 1.8rem;
        border-radius: 999px;
        border: none;
        background: linear-gradient(90deg, #ff7a18, #ff3d81);
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 0 28px rgba(255, 100, 60, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="card" id="duo">
      <h2>Duo Mode</h2>
      <p>Chat with a friend</p>
    </div>

    <button class="cta" id="find">Find Aznabee</button>

    <div>
      <div class="languages" id="languages">
        <button data-locale="" aria-pressed="true">system</button>
        <button data-locale="en">en</button>
        <button data-locale="fr">fr</button>
        <button data-locale="hi">hi</button>
        <button data-locale="ja">ja</button>
        <button data-locale="ar">ar</button>
      </div>
      <p class="caption" id="caption"></p>
    </div>

    <script type="module">
      import { doodle } from "../../dist/freehand-ui.js";

      doodle("#duo", {
        note: { text: "fun with friends", position: "top-right" },
        arrow: true,
        decorations: true,
        padding: 10,
        roughness: 1.65,
        strokeWidth: 1.35,
      });

      // Written once per language. With no `locale` the visitor's own list -
      // their OS setting - picks one, and Arabic lays itself out right to left.
      const note = {
        en: "start chat",
        fr: "démarrer le chat",
        hi: "चैट शुरू करें",
        ja: "チャットを始める",
        ar: "ابدأ الدردشة",
        default: "start chat",
      };

      function drawFind(locale) {
        doodle("#find", {
          note: { text: note, position: "right" },
          locale: locale || null,
          arrow: { from: "right", to: "edge", style: "curved" },
          decorations: true,
          addBreaks: true,
          padding: 8,
          roughness: 1.55,
          strokeWidth: 1.35,
        });

        caption.textContent = locale
          ? `locale: "${locale}"`
          : `following the system: ${navigator.languages.join(", ")}`;
      }

      const caption = document.querySelector("#caption");

      document.querySelector("#languages").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        for (const other of event.currentTarget.querySelectorAll("button")) {
          other.setAttribute("aria-pressed", String(other === button));
        }

        drawFind(button.dataset.locale);
      });

      drawFind("");
    </script>
  </body>
</html>
