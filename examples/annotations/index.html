<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doodle-ui - annotations</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 4rem;
        padding: 3rem 1.5rem;
        background: radial-gradient(
          ellipse at 30% 20%,
          #2a1458 0%,
          #0b0b14 55%
        );
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      .card {
        width: min(280px, 80vw);
        padding: 1.75rem 1.5rem;
        border-radius: 28px;
        background: linear-gradient(
          160deg,
          rgba(120, 80, 255, 0.35),
          rgba(20, 20, 40, 0.9)
        );
        text-align: center;
        box-shadow: 0 0 40px rgba(140, 90, 255, 0.25);
      }
      .card h2 {
        margin: 0 0 0.35rem;
        font-size: 1.25rem;
      }
      .card p {
        margin: 0;
        opacity: 0.7;
        font-size: 0.9rem;
      }
      .cta {
        padding: 0.9rem 1.8rem;
        border-radius: 999px;
        border: none;
        background: linear-gradient(90deg, #ff7a18, #ff3d81);
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 0 28px rgba(255, 100, 60, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="card" id="duo">
      <h2>Duo Mode</h2>
      <p>Chat with a friend</p>
    </div>

    <button class="cta" id="find">Find Aznabee</button>

    <script type="module">
      import { doodle } from "../../dist/freehand-ui.js";

      doodle("#duo", {
        note: { text: "fun with friends", position: "top-right" },
        arrow: true,
        decorations: true,
        padding: 10,
        roughness: 1.65,
        strokeWidth: 1.35,
      });

      doodle("#find", {
        note: { text: "start chat", position: "right" },
        arrow: {
          from: "right",
          to: "edge",
          style: "curved",
        },
        decorations: true,
        addBreaks: true,
        padding: 8,
        roughness: 1.55,
        strokeWidth: 1.35,
      });
    </script>
  </body>
</html>
