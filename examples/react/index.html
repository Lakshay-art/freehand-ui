<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doodle-ui - React</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
          ellipse at 30% 20%,
          #2a1458 0%,
          #0b0b14 55%
        );
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      .stage {
        display: grid;
        gap: 4rem;
        padding: 3rem 1.5rem;
        justify-items: center;
      }
      .card {
        width: min(280px, 80vw);
        padding: 1.75rem 1.5rem;
        border-radius: 28px;
        background: linear-gradient(
          160deg,
          rgba(120, 80, 255, 0.35),
          rgba(20, 20, 40, 0.9)
        );
        text-align: center;
        box-shadow: 0 0 40px rgba(140, 90, 255, 0.25);
      }
      .hook-card {
        background: linear-gradient(
          160deg,
          rgba(80, 200, 160, 0.3),
          rgba(20, 20, 40, 0.9)
        );
        box-shadow: 0 0 40px rgba(80, 200, 160, 0.2);
      }
      .card h2 {
        margin: 0 0 0.35rem;
        font-size: 1.25rem;
      }
      .card p {
        margin: 0;
        opacity: 0.7;
        font-size: 0.9rem;
      }
      .cta {
        padding: 0.9rem 1.8rem;
        border-radius: 999px;
        border: none;
        background: linear-gradient(90deg, #ff7a18, #ff3d81);
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 0 28px rgba(255, 100, 60, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.bundle.js"></script>
  </body>
</html>
