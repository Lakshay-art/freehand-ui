<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doodle-ui — decorations</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 2rem;
        background: #18181b;
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      .box {
        width: 220px;
        height: 120px;
        border-radius: 12px;
        background: rgba(255,255,255,0.05);
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div class="box" id="a">Hearts & stars</div>
    <div class="box" id="b">Sparkles</div>
    <script type="module">
      import { doodle } from "../../dist/freehand-ui.js";

      doodle("#a", {
        decorations: { count: 3, types: ["heart", "star", "sparkle"] },
      });

      doodle("#b", {
        decorations: { count: 2, types: ["steam", "stroke", "smiley"] },
        note: { text: "nice!", position: "bottom-right" },
      });
    </script>
  </body>
</html>
