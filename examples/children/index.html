<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doodle-ui - children</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      #hero {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 1rem;
        width: min(720px, 92vw);
        padding: 1rem;
      }
      .doodle-item {
        padding: 2rem 1rem;
        border-radius: 16px;
        background: rgba(255,255,255,0.06);
        text-align: center;
      }
      .normal {
        padding: 2rem 1rem;
        border-radius: 16px;
        background: rgba(255,255,255,0.02);
        text-align: center;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <div class="doodle-item">Card 1</div>
      <div class="doodle-item">Card 2</div>
      <div class="doodle-item">Card 3</div>
      <div class="normal">Not decorated</div>
    </div>
    <script type="module">
      import { doodle } from "../../dist/freehand-ui.js";
      doodle("#hero", { children: ".doodle-item", padding: 6 });
    </script>
  </body>
</html>
